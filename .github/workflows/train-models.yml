name: Train and validate GradeAI models

on:
  push:
    branches: [main]
    paths:
      - "r_analytics/**"
      - ".github/workflows/train-models.yml"
  workflow_dispatch:

concurrency:
  group: gradeai-model-training
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("rpart", "jsonlite", "cluster"), repos="https://cloud.r-project.org")'
      - name: Generate and validate deterministic synthetic dataset
        run: python r_analytics/data/generate_balanced_dataset.py
      - name: Train all models
        run: Rscript r_analytics/src/train.R
      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("backend/model_store")
          expected = ["decision_tree_model.json", "logistic_regression_model.json", "pca_model.json",
                      "kmeans_model.json", "analytics_summary.json"]
          for name in expected:
              path = root / name
              assert path.exists(), f"Missing artifact: {path}"
              data = json.loads(path.read_text())
              assert isinstance(data, dict) and data, f"Empty or invalid JSON: {path}"
              print(f"Validated {name} ({path.stat().st_size} bytes)")
          tree = json.loads((root / "decision_tree_model.json").read_text())
          assert "tree" in tree and "raw_records" in tree and len(tree["raw_records"]) >= 4
          weights = json.loads((root / "logistic_regression_model.json").read_text())["weights"]
          assert all(k in weights for k in ["intercept", "study_hours", "attendance", "previous_marks"])
          summary = json.loads((root / "analytics_summary.json").read_text())
          validation = summary["validation"]
          assert "stratified 80/20 hold-out" in validation["method"]
          assert validation["cross_validation"]["folds"] == 5
          assert validation["logistic_regression"]["n"] == validation["test_rows"]
          PY
      - name: Commit trained weights to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/model_store/*.json r_analytics/data/student_data.csv
          if git diff --cached --quiet; then
            echo "Model artifacts are already up to date."
          else
            git commit -m "Add refreshed trained model artifacts"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gradeai-trained-models
          path: backend/model_store/*.json
          if-no-files-found: error
          retention-days: 30
