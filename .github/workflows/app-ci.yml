name: GradeAI application checks
# Runs frontend production compilation and API integration smoke tests.
# Includes API contract checks for model selection, analytics artifacts, and history.

on:
  push:
    branches: [main]
    paths:
      - "frontend-react/**"
      - "backend/**"
      - "r_analytics/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt httpx
      - name: Train fresh analytics and model artifacts
        working-directory: r_analytics
        run: Rscript src/train.R
      - run: python tests/smoke_test.py
